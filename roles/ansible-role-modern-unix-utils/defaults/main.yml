#syntax=source.ansible
github_token: ""
upgrade: false

modern_unix_utils_list_extra: []

modern_unix_utils_list:
  - name: bat
    install: true
    github_repo: sharkdp/bat
    asset_name: x86_64-unknown-linux-musl.tar.gz
    is_archive: true
    extra_opts:
      - --strip=1
      - --no-anchored
      - bat

  - name: bandwhich
    install: true
    github_repo: imsnif/bandwhich
    asset_name: x86_64-unknown-linux-musl.tar.gz
    is_archive: true

  - name: btm
    install: true
    github_repo: ClementTsang/bottom
    asset_name: bottom_x86_64-unknown-linux-musl.tar.gz
    is_archive: true
    extra_opts:
      - --no-anchored
      - btm

  - name: ctop
    install: true
    github_repo: bcicen/ctop
    asset_name: linux-amd64
    is_archive: false

  - name: duf
    install: true
    github_repo: muesli/duf
    asset_name: linux_x86_64.tar.gz
    is_archive: true
    extra_opts:
      - --no-anchored
      - duf

  - name: fd
    install: true
    github_repo: sharkdp/fd
    asset_name: x86_64-unknown-linux-musl.tar.gz
    is_archive: true
    extra_opts:
      - --strip=1
      - --no-anchored
      - fd

  - name: fzf
    install: true
    github_repo: junegunn/fzf
    asset_name: linux_amd64.tar.gz
    is_archive: true

  - name: gdu
    install: true
    github_repo: dundee/gdu
    asset_name: linux_amd64_static.tgz
    is_archive: true
    extra_opts:
      - --transform
      - s/^gdu_linux_amd64_static/gdu/

  - name: procs
    install: true
    github_repo: dalance/procs
    asset_name: x86_64-linux.zip
    is_archive: true


  - name: lsd
    install: true
    github_repo: lsd-rs/lsd
    asset_name: x86_64-unknown-linux-musl.tar.gz
    is_archive: true
    extra_opts:
      - --strip=1
      - --no-anchored
      - lsd

  - name: ripgrep
    install: true
    github_repo: BurntSushi/ripgrep
    asset_name: x86_64-unknown-linux-musl.tar.gz
    is_archive: true
    extra_opts:
      - --strip=1
      - --no-anchored
      - rg

  - name: zellij
    install: true
    github_repo: zellij-org/zellij
    asset_name: zellij-x86_64-unknown-linux-musl.tar.gz
    is_archive: true

  - name: micro
    install: true
    github_repo: micro-editor/micro
    asset_name: linux64-static.tar.gz
    is_archive: true
    extra_opts:
      - --strip=1
      - --no-anchored
      - micro

  - name: sd
    install: true
    github_repo: chmln/sd
    asset_name: x86_64-unknown-linux-musl.tar.gz
    is_archive: true
    extra_opts:
      - --strip=1
      - --no-anchored
      - sd
